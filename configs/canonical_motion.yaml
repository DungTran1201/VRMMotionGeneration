# CanonicalHumanoidMotion Configuration
schema_version: "CanonicalHumanoidMotion/v1"
default_fps: 30.0
units: "meters"
coordinate_system: "glTF_Y_UP_Z_BACK_X_RIGHT"
rotation_format: "quaternion_xyzw"

# Validation Tolerances
quaternion_tolerance: 0.001
timestamp_monotonic_tolerance: 0.000001
duration_tolerance_factor: 2.0

# Supported Humanoid Bones (Standard VRM Humanoid 1.0)
required_bones:
  - "hips"
  - "spine"
  - "leftUpperLeg"
  - "leftLowerLeg"
  - "leftFoot"
  - "rightUpperLeg"
  - "rightLowerLeg"
  - "rightFoot"

optional_bones:
  - "chest"
  - "upperChest"
  - "neck"
  - "head"
  - "leftShoulder"
  - "leftUpperArm"
  - "leftLowerArm"
  - "leftHand"
  - "rightShoulder"
  - "rightUpperArm"
  - "rightLowerArm"
  - "rightHand"
  - "leftToes"
  - "rightToes"
