[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ardy-vrm-demo"
version = "0.1.0"
description = "ARDY Text-to-Motion-to-VRM End-to-End Demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
    "torchvision",
    "scipy",
    "safetensors",
    "fastapi",
    "uvicorn",
    "pydantic",
    "transformers",
    "peft",
    "hydra-core",
    "omegaconf",
    "einops",
    "vector-quantize-pytorch",
    "tqdm",
    "pytest",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["backend/src", "vendor/ardy"]
