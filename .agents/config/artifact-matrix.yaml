# Artifact Matrix for VRMMotionGeneration
# Maps change categories to required documents, canonical models, and derived diagrams.

artifact_matrix:
  context_change:
    docs: ["docs/00-discovery/", "docs/01-planning/"]
    models: ["models/context/"]
    diagrams: ["diagrams/context/"]

  requirements_change:
    docs: ["docs/02-requirements/", "docs/04-use-cases/"]
    models: ["models/requirements/"]
    diagrams: ["diagrams/processes/"]

  architecture_change:
    docs: ["docs/05-architecture/"]
    models: ["models/architecture/"]
    diagrams: ["diagrams/architecture/"]

  domain_change:
    docs: ["docs/06-domain/"]
    models: ["models/domain/"]
    diagrams: ["diagrams/data-flow/"]

  api_contract_change:
    docs: ["docs/07-api/", "docs/08-behavior/"]
    models: ["models/api/", "models/interaction/"]
    diagrams: ["diagrams/sequence/", "diagrams/state/"]

  security_change:
    docs: ["docs/09-security/"]
    models: ["models/security/"]
    diagrams: ["diagrams/architecture/"]

  ux_change:
    docs: ["docs/10-ux/"]
    models: ["models/ux/"]
    diagrams: ["diagrams/ux/"]

  test_change:
    docs: ["docs/11-testing/"]
    models: ["models/testing/"]
    diagrams: []

  operations_change:
    docs: ["docs/12-operations/", "docs/13-governance/"]
    models: ["models/deployment/"]
    diagrams: ["diagrams/deployment/"]
