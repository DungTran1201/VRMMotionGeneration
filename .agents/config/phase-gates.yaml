# Phase Gates Configuration for VRMMotionGeneration
# Defines acceptance criteria before transitions between delivery phases.

phases:
  discovery:
    entry_criteria: "Unclear requirements, unfamiliar repository state, or new research task."
    exit_criteria:
      - "Discovery report committed in docs/00-discovery/."
      - "Facts classified as VERIFIED, OBSERVED, INFERRED, or UNVERIFIED."
      - "No breaking code changes during discovery."

  planning:
    entry_criteria: "Completed discovery and initial problem definition."
    exit_criteria:
      - "Architecture Decision Records (ADRs) drafted in docs/05-architecture/."
      - "Artifact matrix consulted and required artifacts identified."

  modeling:
    entry_criteria: "Approved plan and agreed boundary definitions."
    exit_criteria:
      - "Structured YAML/JSON schemas created in models/."
      - "Human-readable docs updated in docs/."
      - "Derived diagrams updated in diagrams/ citing source models."

  implementation:
    entry_criteria: "Models and documentation approved."
    exit_criteria:
      - "Implementation restricted to designated product directory (frontend/, backend/, or infra/)."
      - "No direct imports between exp/ and product directories."
      - "Automated unit tests added in tests/ directory."

  verification:
    entry_criteria: "Implementation complete and candidate PR opened."
    exit_criteria:
      - "Automated test suites pass without regressions."
      - "Layout validation passes (.agents/scripts/validate_layout.py)."
      - "Evidence log recorded with command outputs and exit codes."
